<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redeem - Watch Me Suffocate</title>
  <meta name="theme-color" content="#060809" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Orbitron:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style/main.css" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
</head>

<body>
  <header class="site-header">
    <a class="brand" href="index.html"><img src="logo.png" alt="" /><span>Watch Me Suffocate</span></a>
    <nav class="nav">
      <a href="suffocate.html">Token</a>
      <a href="redeem.html" aria-current="page">Redeem</a>
      <a href="help.html">Help</a>
    </nav>
  </header>

  <main>
    <section class="card narrow">
      <div class="page-head">
        <span class="eyebrow">Claim</span>
        <h1>Redeem Token</h1>
        <p class="lead">Enter your code and the wallet that should receive the token.</p>
      </div>

      <form onsubmit="event.preventDefault(); redeem();">
        <div class="field">
          <label for="code">Redeem Code</label>
          <input type="text" id="code" placeholder="WMS-ABCD1234" autocomplete="off" spellcheck="false" />
        </div>

        <div class="field">
          <label for="wallet">Wallet Address</label>
          <div class="input-row">
            <input type="text" id="wallet" placeholder="0x…" autocomplete="off" spellcheck="false" />
            <button class="btn btn-ghost" type="button" onclick="connectWallet()">Connect MetaMask</button>
          </div>
        </div>

        <div class="form-actions">
          <button class="btn btn-primary" id="redeem-btn" type="submit">Redeem Now</button>
        </div>
      </form>

      <div class="status" id="status"></div>

      <p class="helper">Need help? <a href="help.html">Read the guide</a></p>
    </section>
  </main>

  <footer class="site-footer">
    <a href="https://watchmesuffocate.com" target="_blank" rel="noopener">&copy; 2025 Watch Me Suffocate</a>
  </footer>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const codeFromURL = urlParams.get("code");

    if (codeFromURL) {
      document.getElementById("code").value = codeFromURL;
    }

    async function connectWallet() {
      if (!window.ethereum) {
        showStatus("MetaMask is required to connect a wallet. You can also paste your address manually.", "warn");
        return;
      }
      try {
        const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
        document.getElementById("wallet").value = accounts[0];
        showStatus("");
      } catch (err) {
        console.error(err);
        showStatus("Wallet connection failed.", "error");
      }
    }

    async function redeem() {
      const code = document.getElementById("code").value.trim();
      const wallet = document.getElementById("wallet").value.trim();

      if (!code || !wallet) {
        showStatus("Please enter a valid code and wallet address.", "warn");
        return;
      }

      const validation = await validateWalletAddress(wallet);
      if (!validation.valid) {
        showStatus(validation.reason, "error");
        return;
      } else if (validation.warning) {
        showStatus(validation.warning, "warn");
      }

      const button = document.getElementById("redeem-btn");
      button.disabled = true;
      button.textContent = "Processing…";
      showStatus("Processing redemption...");

      try {
        const res = await fetch("https://api.watchmesuffocate.com/api/redeem", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code, address: wallet })
        });

        const data = await res.json();
        if (res.ok) {
          showStatus("Token redeemed successfully!", "ok");
        } else {
          showStatus(`Error: ${data.message || "Redemption failed."}`, "error");
        }
      } catch (err) {
        console.error(err);
        showStatus("Network error during redemption.", "error");
      } finally {
        button.disabled = false;
        button.textContent = "Redeem Now";
      }
    }

    function showStatus(msg, tone = "") {
      const el = document.getElementById("status");
      el.innerText = msg;
      el.dataset.tone = tone;
    }

    async function validateWalletAddress(address) {
      const isValidFormat = /^0x[a-fA-F0-9]{40}$/.test(address);
      if (!isValidFormat) {
        return { valid: false, reason: "Invalid wallet address format." };
      }

      if (window.ethereum) {
        try {
          const accounts = await window.ethereum.request({ method: "eth_accounts" });
          if (!accounts.map(a => a.toLowerCase()).includes(address.toLowerCase())) {
            return { valid: true, warning: "Address is not currently connected via MetaMask." };
          }
        } catch (err) {
          return { valid: true, warning: "Could not verify MetaMask connection." };
        }
      }

      return { valid: true };
    }
  </script>
</body>

</html>
